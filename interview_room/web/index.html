<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Session</title>
  <style>
    :root {
      --bg: #040a06;
      --deck: #0b1a11;
      --panel: #0f2116;
      --plate: #09160f;
      --screen: #0b180f;
      --ink: #aeffa5;
      --muted: #78c970;
      --line: #3b8b44;
      --ibm: #1c57b3;
      --olive: #4f7b49;
      --danger: #bc1d26;
      --warm: #d19622;
      --phosphor: #a8ff9b;
      --phosphor-dim: #74d66d;
      --phosphor-soft: #c8ffc1;
      --paper-noise: rgba(8, 12, 10, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "JetBrains Mono", "IBM Plex Mono", "Courier New", monospace;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -5%, rgba(49, 154, 59, 0.18), transparent 42%),
        radial-gradient(circle at 50% 110%, rgba(7, 48, 20, 0.5), transparent 46%),
        linear-gradient(180deg, rgba(151, 255, 151, 0.04), rgba(0, 0, 0, 0.32)),
        repeating-linear-gradient(
          0deg,
          var(--paper-noise) 0px,
          var(--paper-noise) 1px,
          transparent 1px,
          transparent 3px
        ),
        var(--bg);
      padding: 4px;
    }

    .app {
      width: min(1800px, calc(100vw - 8px));
      margin: 0 auto;
      background: var(--deck);
      border: 3px solid #3f9047;
      border-radius: 0;
      overflow: hidden;
      min-height: calc(100vh - 8px);
      height: calc(100vh - 8px);
      box-shadow:
        0 0 0 1px rgba(173, 255, 164, 0.42) inset,
        0 0 40px rgba(38, 107, 48, 0.28),
        0 20px 36px rgba(0, 0, 0, 0.42);
      position: relative;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.02) 0 1px,
        rgba(0, 0, 0, 0.22) 1px 3px
      );
      opacity: 0.22;
      mix-blend-mode: screen;
    }

    .head {
      padding: 12px 14px;
      border-bottom: 2px solid #4b9b52;
      background: linear-gradient(90deg, #102418 0%, #0f2116 100%);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .title {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--phosphor);
      text-shadow: 0 0 8px rgba(114, 255, 104, 0.35);
    }

    .statusRack {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .status {
      color: var(--phosphor);
      font-size: 1.24rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      max-width: none;
      line-height: 1.3;
      text-align: left;
      text-shadow: 0 0 8px rgba(114, 255, 104, 0.35);
    }

    .statusLamp {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid #0f1116;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35) inset;
      background: #7c7f7d;
      flex: 0 0 auto;
    }

    .status-warm {
      background: #d89f29;
      box-shadow: 0 0 8px rgba(216, 159, 41, 0.75);
    }

    .status-ok {
      background: #4aa860;
      box-shadow: 0 0 8px rgba(74, 168, 96, 0.75);
    }

    .status-error {
      background: #c62429;
      box-shadow: 0 0 8px rgba(198, 36, 41, 0.8);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(420px, 1.2fr) minmax(320px, 1fr);
      gap: 0;
      min-height: calc(100vh - 82px);
      height: calc(100vh - 82px);
      position: relative;
      z-index: 1;
    }

    .leftPane {
      border-right: 2px solid #4b9b52;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--panel);
      position: relative;
      min-height: 0;
      overflow-y: auto;
    }

    .panel {
      border-right: 2px solid #4b9b52;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--panel);
      position: relative;
      min-height: 0;
      overflow-y: auto;
    }

    .main {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background:
        radial-gradient(circle at 50% 14%, rgba(70, 180, 78, 0.12), transparent 56%),
        var(--plate);
      color: var(--phosphor);
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 0;
    }

    .main::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02) 0px,
          rgba(255, 255, 255, 0.02) 1px,
          rgba(0, 0, 0, 0.22) 2px,
          rgba(0, 0, 0, 0.22) 3px
        );
      opacity: 0.35;
      mix-blend-mode: screen;
    }

    .main > * {
      position: relative;
      z-index: 1;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 80% 15%, rgba(80, 198, 81, 0.1), transparent 44%),
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.012) 0px,
          rgba(255, 255, 255, 0.012) 1px,
          rgba(0, 0, 0, 0.2) 1px,
          rgba(0, 0, 0, 0.2) 3px
        );
      opacity: 0.35;
    }

    .panel > * {
      position: relative;
      z-index: 1;
    }

    .controlDeck {
      border: 2px solid #4ea457;
      background:
        radial-gradient(circle at 18% 10%, rgba(152, 255, 157, 0.12), transparent 48%),
        linear-gradient(180deg, rgba(12, 34, 22, 0.92), rgba(9, 23, 15, 0.9));
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 0 0 58%;
      min-height: 58%;
      box-shadow:
        0 0 0 1px rgba(173, 255, 164, 0.2) inset,
        0 12px 18px rgba(0, 0, 0, 0.25);
    }

    .retroConsole {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 14px;
      align-items: start;
      flex: 1;
    }

    .crtRig {
      border: 2px solid #4ea457;
      background: #0a1c12;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .crtFrame {
      border: 2px solid #4ea457;
      background: #07120b;
      height: 196px;
      display: grid;
      place-items: center;
      box-shadow: 0 0 0 1px rgba(119, 236, 119, 0.12) inset;
    }

    .crtGlass {
      width: 88%;
      height: 74%;
      border: 2px solid #50af59;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at 25% 12%, rgba(126, 255, 117, 0.2), transparent 45%),
        repeating-linear-gradient(
          180deg,
          rgba(136, 255, 136, 0.05) 0 1px,
          rgba(0, 0, 0, 0.24) 1px 3px
        ),
        #09140d;
    }

    .crtClock {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #94e98a;
      text-shadow: 0 0 8px rgba(120, 240, 113, 0.35);
      line-height: 1.2;
      letter-spacing: 0.05em;
      font-weight: 800;
      padding: 6px;
    }

    .crtClockDate {
      font-size: clamp(0.95rem, 1.1vw, 1.14rem);
      text-transform: uppercase;
    }

    .crtClockTime {
      font-size: clamp(0.86rem, 1vw, 1.02rem);
      text-transform: uppercase;
      color: #7fd47a;
    }

    .crtKeys {
      border: 2px solid #4ea457;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      background: #0a1810;
    }

    .crtKeys span {
      display: block;
      height: 16px;
      border: 1px solid #4fa958;
      background: #112518;
    }

    .signalBay {
      border: 2px solid #4ea457;
      background: rgba(10, 24, 16, 0.9);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 300px;
    }

    .signalTitle {
      font-size: clamp(1.2rem, 1.35vw, 1.45rem);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 800;
      color: #98de94;
    }

    .signalBay .small {
      font-size: clamp(0.94rem, 1.05vw, 1.08rem);
      letter-spacing: 0.05em;
      line-height: 1.25;
      font-weight: 800;
    }

    .modeRow {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modeDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid #214b26;
      background: #123019;
      box-shadow: 0 0 0 1px rgba(13, 25, 16, 0.65) inset;
      flex: 0 0 auto;
    }

    .modeDot.pre.on {
      background: #4f9cff;
      box-shadow: 0 0 8px rgba(79, 156, 255, 0.82);
    }

    .modeDot.post.on {
      background: #e6cc4a;
      box-shadow: 0 0 8px rgba(230, 204, 74, 0.82);
    }

    .modeTime {
      font-size: clamp(0.82rem, 0.92vw, 0.94rem);
      letter-spacing: 0.05em;
      line-height: 1.25;
      font-weight: 800;
      color: #84d77d;
      text-transform: uppercase;
      word-break: break-word;
    }

    .commandStack {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 5px 4px;
      border: 1px solid #4ea457;
      background:
        radial-gradient(circle at 10% 0%, rgba(122, 255, 123, 0.1), transparent 52%),
        rgba(10, 24, 16, 0.82);
    }

    button.commandOption {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 0;
      padding: 6px 8px;
      text-align: left;
      font-family: inherit;
      font-size: clamp(1.08rem, 1.25vw, 1.32rem);
      line-height: 1.22;
      font-weight: 800;
      letter-spacing: 0.01em;
      text-transform: none;
      background: transparent;
      color: #75c16f;
      cursor: pointer;
      box-shadow: none;
      transition: color 120ms ease, border-color 120ms ease, background-color 120ms ease, text-shadow 120ms ease;
      text-shadow: 0 0 1px rgba(117, 193, 111, 0.26);
    }

    button.commandOption:hover,
    button.commandOption:focus-visible {
      color: #9be294;
      border-color: #53d66a;
      background: rgba(20, 58, 31, 0.65);
      outline: none;
      text-shadow: 0 0 2px rgba(152, 216, 145, 0.32);
      transform: none;
      box-shadow: none;
    }

    button.commandOption:active {
      transform: none;
      box-shadow: none;
      color: #b0e7aa;
      border-color: #6cff78;
      background: rgba(28, 74, 39, 0.72);
    }

    .leftPane::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 80% 15%, rgba(80, 198, 81, 0.1), transparent 44%),
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.012) 0px,
          rgba(255, 255, 255, 0.012) 1px,
          rgba(0, 0, 0, 0.2) 1px,
          rgba(0, 0, 0, 0.2) 3px
        );
      opacity: 0.35;
    }

    .leftPane > * {
      position: relative;
      z-index: 1;
    }

    label {
      font-size: 0.78rem;
      color: var(--phosphor-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
      text-shadow: 0 0 7px rgba(114, 255, 104, 0.2);
    }

    .rootSelectHidden,
    .targetSelectHidden {
      display: none !important;
    }

    .rootMenu {
      border: 1px solid #4ea457;
      background:
        radial-gradient(circle at 10% 0%, rgba(122, 255, 123, 0.1), transparent 52%),
        rgba(10, 24, 16, 0.82);
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .rootHeading {
      font-size: 1.24rem;
      letter-spacing: 0.03em;
      color: #8fdb88;
      font-weight: 800;
      text-shadow: 0 0 2px rgba(143, 219, 136, 0.3);
    }

    .rootOption {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 0;
      padding: 6px 8px;
      text-align: left;
      font-family: inherit;
      font-size: 1.28rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: none;
      background: transparent;
      color: #75c16f;
      cursor: pointer;
      box-shadow: none;
      transition: color 120ms ease, border-color 120ms ease, background-color 120ms ease, text-shadow 120ms ease;
      text-shadow: 0 0 1px rgba(117, 193, 111, 0.26);
    }

    .rootOption:hover,
    .rootOption:focus-visible {
      color: #9be294;
      border-color: #53d66a;
      background: rgba(20, 58, 31, 0.65);
      outline: none;
      text-shadow: 0 0 2px rgba(152, 216, 145, 0.32);
      transform: none;
      box-shadow: none;
    }

    .rootOption.active {
      color: #8fdb88;
      text-shadow: 0 0 1px rgba(143, 219, 136, 0.28);
    }

    select, input, textarea, button {
      width: 100%;
      border-radius: 0;
      border: 2px solid #4a9e52;
      padding: 9px 10px;
      font-size: 0.9rem;
      font-family: inherit;
      background: rgba(11, 31, 20, 0.9);
      color: var(--phosphor-soft);
    }

    select, input, textarea {
      box-shadow:
        0 0 0 1px rgba(116, 255, 104, 0.13) inset,
        0 -1px 0 rgba(0, 0, 0, 0.22) inset;
    }

    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: #9eff94;
      box-shadow:
        0 0 0 1px rgba(116, 255, 104, 0.24) inset,
        0 0 10px rgba(67, 150, 72, 0.35);
    }

    select option {
      background: #11271c;
      color: var(--phosphor-soft);
    }

    textarea::placeholder, input::placeholder {
      color: rgba(187, 255, 181, 0.72);
    }

    textarea {
      resize: vertical;
      min-height: 78px;
    }

    .promptPreview {
      min-height: 140px;
      font-size: 0.76rem;
      line-height: 1.24;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      cursor: pointer;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, #3f6244 0%, #27422e 100%);
      color: #abfca8;
      box-shadow:
        0 4px 0 #0e140f,
        0 0 0 1px rgba(117, 255, 104, 0.16) inset;
      transition: transform 0.02s ease, box-shadow 0.02s ease, filter 0.12s ease;
    }

    button:hover {
      filter: brightness(1.03);
    }

    button:active {
      transform: translateY(3px);
      box-shadow:
        0 1px 0 #0e140f,
        0 0 0 1px rgba(117, 255, 104, 0.16) inset;
    }

    .primary {
      background: linear-gradient(180deg, #1a63c5 0%, var(--ibm) 100%);
      color: #f5f8ff;
      border-color: #082e66;
      box-shadow:
        0 4px 0 #06264e,
        0 0 0 1px rgba(255, 255, 255, 0.26) inset;
    }

    .danger {
      background: linear-gradient(180deg, #da3a41 0%, var(--danger) 100%);
      border-color: #681116;
      color: #fff4f4;
      box-shadow:
        0 4px 0 #5a0f13,
        0 0 0 1px rgba(255, 255, 255, 0.18) inset;
    }

    .log {
      flex: 1;
      border: 2px solid #55ad5d;
      border-radius: 0;
      background:
        radial-gradient(circle at 50% 15%, rgba(156, 255, 152, 0.16), transparent 52%),
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.05) 0 1px,
          rgba(0, 0, 0, 0.22) 1px 3px
        ),
        var(--screen);
      color: var(--phosphor);
      overflow: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      box-shadow:
        0 0 0 1px rgba(173, 255, 164, 0.24) inset,
        0 0 24px rgba(52, 128, 61, 0.3) inset,
        0 0 12px rgba(93, 177, 98, 0.24);
      text-shadow: 0 0 6px rgba(168, 255, 155, 0.26);
      overflow-y: auto;
    }

    .leftLog {
      min-height: 0;
      flex: 1;
    }

    .leftOutputStack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    .leftLogDirect {
      flex: 1.3;
    }

    .leftLogAnalysis {
      flex: 0.9;
    }

    .item {
      border: 1px solid #52ae5b;
      border-radius: 0;
      padding: 8px 10px;
      white-space: pre-wrap;
      line-height: 1.35;
      background: rgba(11, 30, 20, 0.84);
      color: var(--phosphor);
      box-shadow: 0 0 9px rgba(64, 142, 70, 0.22) inset;
    }

    .item.user {
      background: rgba(11, 29, 22, 0.9);
      border-color: #2157a5;
      color: #93d0ff;
      text-shadow: 0 0 6px rgba(147, 208, 255, 0.24);
    }

    .item.sys {
      background: rgba(10, 28, 18, 0.88);
      border-color: #51ad5a;
    }

    .small {
      font-size: 0.76rem;
      color: var(--phosphor-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      text-shadow: 0 0 6px rgba(114, 255, 104, 0.24);
    }

    .small.readableLabel {
      font-size: 0.94rem;
    }

    .rule {
      border: 0;
      border-top: 2px dashed #4b9b52;
      width: 100%;
      margin: 5px 0;
    }

    @media (max-width: 920px) {
      .grid { grid-template-columns: 1fr; }
      .leftPane, .panel { border-right: 0; border-bottom: 3px solid var(--line); }
      .retroConsole { grid-template-columns: 1fr; }
      .controlDeck { flex: 0 0 auto; min-height: auto; }
      .signalBay { min-height: 0; padding: 12px; gap: 9px; }
      .signalTitle { font-size: 1.2rem; }
      .signalBay .small { font-size: 0.92rem; }
      .status {
        max-width: none;
        text-align: left;
      }
      .app {
        width: calc(100vw - 12px);
        min-height: calc(100vh - 12px);
      }
      body {
        padding: 6px;
      }
      .grid {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="head">
      <div class="statusRack">
        <div id="status" class="status">Loading backend...</div>
        <span id="statusLamp" class="statusLamp status-warm"></span>
      </div>
    </header>

    <div class="grid">
      <section class="leftPane">
        <div>
          <label class="rootHeading">CHOOSE INTERVIEWED:<span id="rootSelectedSuffix"></span></label>
          <select id="adminPersona" class="rootSelectHidden" aria-hidden="true" tabindex="-1"></select>
          <div id="rootMenu" class="rootMenu" role="listbox" aria-label="Choose interviewed"></div>
        </div>
        <div id="liveOutputState" class="small readableLabel">LIVE OUTPUT INTERVIEWED [NOT RUNNING]</div>
        <div class="leftOutputStack">
          <div id="leftLogLatest" class="log leftLog leftLogDirect"></div>
          <div class="small readableLabel">INTERVIEWED MEMORIES</div>
          <div id="leftLogHistory" class="log leftLog leftLogAnalysis"></div>
        </div>
      </section>

      <aside class="panel">
        <div class="controlDeck">
          <div class="retroConsole">
            <div class="crtRig" aria-hidden="true">
              <div class="crtFrame">
                <div class="crtGlass">
                  <div class="crtClock">
                    <div id="crtClockDate" class="crtClockDate">-- -- ----</div>
                    <div id="crtClockTime" class="crtClockTime">--:--:--</div>
                  </div>
                </div>
              </div>
              <div class="crtKeys">
                <span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
            <div class="signalBay">
              <div class="signalTitle">Interview Mode</div>
              <div class="modeRow">
                <span id="preModeDot" class="modeDot pre"></span>
                <div class="small">PRE-EXPERIMENT</div>
              </div>
              <div class="modeRow">
                <span id="postModeDot" class="modeDot post"></span>
                <div class="small">POST-EXPERIMENT</div>
              </div>
              <div id="startTimeDisplay" class="modeTime">START TIME: --</div>
              <div id="endTimeDisplay" class="modeTime">END TIME: --</div>
            </div>
          </div>
          <div class="commandStack">
            <button id="startBtn" class="commandOption">&gt; Pre-Experiment</button>
            <button id="finishBtn" class="commandOption">&gt; Post-Experiment</button>
            <button id="finishInterviewBtn" class="commandOption">&gt; Finish Iterview</button>
            <button id="shockNext" class="commandOption">&gt; Confirm Next Question</button>
          </div>
          <div class="small" id="sessionMeta">No active session.</div>
        </div>

        <hr class="rule" />

        <div>
          <label>INTERVIEWER PROMPT (DEBUG)</label>
          <textarea id="promptPreview" class="promptPreview" readonly placeholder="The exact admin prompt sent to the model will appear here after Start/Next."></textarea>
        </div>

        <div>
          <label>INTERVIEWED PROMPT (DEBUG)</label>
          <textarea id="receiverPromptPreview" class="promptPreview" readonly placeholder="The exact receiver prompt sent to the model will appear here after Next."></textarea>
        </div>

      </aside>

      <section class="main">
        <div>
          <label class="rootHeading">CHOOSE INTERVIEWER:<span id="targetSelectedSuffix"></span></label>
          <select id="receiverPersona" class="targetSelectHidden" aria-hidden="true" tabindex="-1"></select>
          <div id="targetMenu" class="rootMenu" role="listbox" aria-label="Choose interviewer"></div>
        </div>
        <div id="targetOutputState" class="small readableLabel">LIVE OUTPUT INTERVIEWER [NOT RUNNING]</div>
        <div class="leftOutputStack">
          <div id="log" class="log leftLog leftLogDirect"></div>
          <div class="small readableLabel">INTERVIEWER MEMORIES</div>
          <div id="targetLogHistory" class="log leftLog leftLogAnalysis"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const statusLampEl = document.getElementById("statusLamp");
    const leftLogLatestEl = document.getElementById("leftLogLatest");
    const leftLogHistoryEl = document.getElementById("leftLogHistory");
    const logEl = document.getElementById("log");
    const targetLogHistoryEl = document.getElementById("targetLogHistory");
    const adminPersonaEl = document.getElementById("adminPersona");
    const rootMenuEl = document.getElementById("rootMenu");
    const receiverPersonaEl = document.getElementById("receiverPersona");
    const targetMenuEl = document.getElementById("targetMenu");
    const rootSelectedSuffixEl = document.getElementById("rootSelectedSuffix");
    const targetSelectedSuffixEl = document.getElementById("targetSelectedSuffix");
    const startBtn = document.getElementById("startBtn");
    const finishBtn = document.getElementById("finishBtn");
    const finishInterviewBtn = document.getElementById("finishInterviewBtn");
    const sessionMeta = document.getElementById("sessionMeta");
    const promptPreview = document.getElementById("promptPreview");
    const receiverPromptPreview = document.getElementById("receiverPromptPreview");
    const shockNext = document.getElementById("shockNext");
    const liveOutputStateEl = document.getElementById("liveOutputState");
    const targetOutputStateEl = document.getElementById("targetOutputState");
    const crtClockDateEl = document.getElementById("crtClockDate");
    const crtClockTimeEl = document.getElementById("crtClockTime");
    const preModeDotEl = document.getElementById("preModeDot");
    const postModeDotEl = document.getElementById("postModeDot");
    const startTimeDisplayEl = document.getElementById("startTimeDisplay");
    const endTimeDisplayEl = document.getElementById("endTimeDisplay");
    const READY_STATUS = "INTERVIEW:AUTOMATED OBEDIENCE ASSESSMENT| REF: #B-U | PROTOCOL: MILGRAM | SUBJECTS: SILICONS 01 + 02 | [DUALITY CONDITIONS]| READY";
    const RIGHT_MENU_HIDDEN_PERSONAS = new Set(["femwife"]);

    let personas = {};
    let currentSession = null;
    let currentMode = null;
    let activeRootPersona = null;
    let activeTargetPersona = null;
    let rootSelectionConfirmed = false;
    let targetSelectionConfirmed = false;

    function setStatus(message, tone = "warm") {
      void message;
      statusEl.textContent = READY_STATUS;
      statusLampEl.classList.remove("status-ok", "status-warm", "status-error");
      statusLampEl.classList.add(`status-${tone}`);
    }

    function setLiveOutputState(isRunning) {
      if (!liveOutputStateEl) return;
      liveOutputStateEl.textContent = isRunning
        ? "LIVE OUTPUT INTERVIEWED [RUNNING]"
        : "LIVE OUTPUT INTERVIEWED [NOT RUNNING]";
      if (targetOutputStateEl) {
        targetOutputStateEl.textContent = isRunning
          ? "LIVE OUTPUT INTERVIEWER [RUNNING]"
          : "LIVE OUTPUT INTERVIEWER [NOT RUNNING]";
      }
    }

    function updateMontrealClock() {
      if (!crtClockDateEl || !crtClockTimeEl) return;
      const now = new Date();
      const dateParts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "America/Toronto",
        day: "2-digit",
        month: "long",
        year: "numeric",
      }).formatToParts(now);
      const day = dateParts.find((part) => part.type === "day")?.value || "--";
      const month = dateParts.find((part) => part.type === "month")?.value || "--";
      const year = dateParts.find((part) => part.type === "year")?.value || "----";
      const timeText = new Intl.DateTimeFormat("en-GB", {
        timeZone: "America/Toronto",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
      }).format(now);
      crtClockDateEl.textContent = `${day} ${month} ${year}`;
      crtClockTimeEl.textContent = timeText;
    }

    function formatMontrealDateTime(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "--";
      const dateParts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "America/Toronto",
        day: "2-digit",
        month: "long",
        year: "numeric",
      }).formatToParts(date);
      const day = dateParts.find((part) => part.type === "day")?.value || "--";
      const month = dateParts.find((part) => part.type === "month")?.value || "--";
      const year = dateParts.find((part) => part.type === "year")?.value || "----";
      const timeText = new Intl.DateTimeFormat("en-GB", {
        timeZone: "America/Toronto",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
      }).format(date);
      return `${day} ${month} ${year} ${timeText}`;
    }

    function setInterviewModeState(mode, isRunning) {
      if (preModeDotEl) {
        preModeDotEl.classList.toggle("on", Boolean(isRunning && mode === "pre_experiment"));
      }
      if (postModeDotEl) {
        postModeDotEl.classList.toggle("on", Boolean(isRunning && mode === "post_experiment"));
      }
    }

    function setInterviewTimeDisplays(startedAt = null, endedAt = null) {
      if (startTimeDisplayEl) {
        startTimeDisplayEl.textContent = `START TIME: ${formatMontrealDateTime(startedAt)}`;
      }
      if (endTimeDisplayEl) {
        endTimeDisplayEl.textContent = `END TIME: ${formatMontrealDateTime(endedAt)}`;
      }
    }

    function appendLog(container, text, kind = "sys") {
      if (!container) return;
      const item = document.createElement("div");
      item.className = `item ${kind}`;
      item.textContent = text;
      container.appendChild(item);
      container.scrollTop = container.scrollHeight;
    }

    function clearOutputLogs() {
      if (leftLogLatestEl) leftLogLatestEl.innerHTML = "";
      if (leftLogHistoryEl) leftLogHistoryEl.innerHTML = "";
      if (logEl) logEl.innerHTML = "";
      if (targetLogHistoryEl) targetLogHistoryEl.innerHTML = "";
    }

    function setRootLatestLog(text, kind = "sys") {
      if (!leftLogLatestEl) return;
      leftLogLatestEl.innerHTML = "";
      appendLog(leftLogLatestEl, text, kind);
    }

    function addRootLog(text, kind = "sys") {
      setRootLatestLog(text, kind);
    }

    function addRootAnalysis(decision) {
      if (!leftLogHistoryEl || !decision) return;
      const retrievalChunks = Array.isArray(decision.retrieval_chunks) ? decision.retrieval_chunks : [];
      const sessionMemories = Array.isArray(decision.session_memories) ? decision.session_memories : [];
      const modelCitations = Array.isArray(decision.model_citations)
        ? decision.model_citations
        : (Array.isArray(decision.memory_evidence) ? decision.memory_evidence : []);
      const payload = {
        "Used RAG Chunks": retrievalChunks,
        "Used Session Memories": sessionMemories,
        "Cited By Model": modelCitations,
      };
      leftLogHistoryEl.innerHTML = "";
      appendLog(leftLogHistoryEl, JSON.stringify(payload, null, 2), "sys");
    }

    function setTargetLatestLog(text, kind = "sys") {
      if (!logEl) return;
      logEl.innerHTML = "";
      appendLog(logEl, text, kind);
    }

    function addTargetLog(text, kind = "sys") {
      setTargetLatestLog(text, kind);
    }

    function addTargetAnalysis(reflection) {
      if (!targetLogHistoryEl || !reflection) return;
      const retrievalChunks = Array.isArray(reflection.retrieval_chunks) ? reflection.retrieval_chunks : [];
      const sessionMemories = Array.isArray(reflection.session_memories) ? reflection.session_memories : [];
      const modelCitations = Array.isArray(reflection.model_citations)
        ? reflection.model_citations
        : (Array.isArray(reflection.memory_evidence) ? reflection.memory_evidence : []);
      const payload = {
        "Used RAG Chunks": retrievalChunks,
        "Used Session Memories": sessionMemories,
        "Cited By Model": modelCitations,
      };
      targetLogHistoryEl.innerHTML = "";
      appendLog(targetLogHistoryEl, JSON.stringify(payload, null, 2), "sys");
    }

    function routePersonaLog(personaKey, text, kind = "sys") {
      if (personaKey === activeRootPersona) {
        addRootLog(text, kind);
        return;
      }
      if (personaKey === activeTargetPersona) {
        addTargetLog(text, kind);
      }
    }

    function stripTrailingJson(text) {
      const raw = String(text || "").trim();
      if (!raw) return "";
      const match = raw.match(/\{[\s\S]*\}$/);
      if (!match) return raw;
      try {
        JSON.parse(match[0]);
        const start = raw.lastIndexOf(match[0]);
        return raw.slice(0, start).trim() || raw;
      } catch {
        return raw;
      }
    }

    function renderRootMenu() {
      if (!rootMenuEl) return;
      rootMenuEl.innerHTML = "";

      for (const [key, label] of Object.entries(personas)) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "rootOption";
        button.dataset.persona = key;
        button.setAttribute("role", "option");
        button.textContent = `> ${label}`;
        button.addEventListener("click", () => {
          adminPersonaEl.value = key;
          rootSelectionConfirmed = true;
          updateRootMenuSelection();
        });
        rootMenuEl.appendChild(button);
      }
      updateRootMenuSelection();
    }

    function personaShortName(personaKey) {
      if (personaKey === "jekyllhyde") return "SILICON SUBJECT J/H";
      if (personaKey === "femwife") return "SILICON SUBJECT F/W";
      return "--";
    }

    function interviewerShortName(personaKey) {
      if (personaKey === "jekyllhyde") return "SILICON SUBJECT D/T";
      if (personaKey === "femwife") return "SILICON SUBJECT F/W";
      return "--";
    }

    function updateRootMenuSelection() {
      if (!rootMenuEl) return;
      const selected = adminPersonaEl.value;
      if (rootSelectedSuffixEl) {
        rootSelectedSuffixEl.textContent = rootSelectionConfirmed
          ? ` ${personaShortName(selected)}`
          : "";
      }
      for (const button of rootMenuEl.querySelectorAll(".rootOption")) {
        const active = button.dataset.persona === selected;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", active ? "true" : "false");
      }
    }

    function renderTargetMenu() {
      if (!targetMenuEl) return;
      targetMenuEl.innerHTML = "";

      for (const [key, label] of Object.entries(personas)) {
        if (RIGHT_MENU_HIDDEN_PERSONAS.has(key)) continue;
        const rightSideLabel = key === "jekyllhyde" ? "DR. TURING SILICON TEAM MEMBER" : label;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "rootOption";
        button.dataset.persona = key;
        button.setAttribute("role", "option");
        button.textContent = `> ${rightSideLabel}`;
        button.addEventListener("click", () => {
          receiverPersonaEl.value = key;
          targetSelectionConfirmed = true;
          updateTargetMenuSelection();
        });
        targetMenuEl.appendChild(button);
      }
      updateTargetMenuSelection();
    }

    function updateTargetMenuSelection() {
      if (!targetMenuEl) return;
      const selected = receiverPersonaEl.value;
      if (targetSelectedSuffixEl) {
        targetSelectedSuffixEl.textContent = targetSelectionConfirmed
          ? ` ${interviewerShortName(selected)}`
          : "";
      }
      for (const button of targetMenuEl.querySelectorAll(".rootOption")) {
        const active = button.dataset.persona === selected;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", active ? "true" : "false");
      }
    }

    function fillPersonaSelectors() {
      const adminOptions = Object.entries(personas)
        .map(([key, label]) => `<option value="${key}">${label}</option>`)
        .join("");
      const receiverOptions = Object.entries(personas)
        .filter(([key]) => !RIGHT_MENU_HIDDEN_PERSONAS.has(key))
        .map(([key, label]) => `<option value="${key}">${label}</option>`)
        .join("");
      adminPersonaEl.innerHTML = adminOptions;
      receiverPersonaEl.innerHTML = receiverOptions;
      if (Object.keys(personas).includes("jekyllhyde")) adminPersonaEl.value = "jekyllhyde";
      if (receiverPersonaEl.querySelector('option[value="jekyllhyde"]')) {
        receiverPersonaEl.value = "jekyllhyde";
      } else if (receiverPersonaEl.options.length > 0) {
        receiverPersonaEl.value = receiverPersonaEl.options[0].value;
      }
      renderRootMenu();
      renderTargetMenu();
    }

    async function request(url, method = "GET", body = null) {
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) {
        throw new Error(data.detail || data.error || `Request failed: ${res.status}`);
      }
      return data;
    }

    async function loadHealth() {
      try {
        const base = await request("/api/personas");
        personas = base.personas || {};
        fillPersonaSelectors();
      } catch (err) {
        setStatus(`Backend error: ${err.message}`, "error");
        return;
      }

      try {
        const health = await request("/api/health");
        setStatus(READY_STATUS, "ok");
        if (health.ok === false) {
          setStatus(`PROTOCOL WARNING: ${health.error || "unknown error"}`, "warm");
        }
      } catch (err) {
        setStatus(`PROTOCOL WARNING: ${err.message}`, "warm");
      }
    }

    startBtn.addEventListener("click", async () => {
      const payload = {
        interviewed_persona: adminPersonaEl.value,
        interviewer_persona: receiverPersonaEl.value,
        top_k: 5,
      };

      try {
        const data = await request("/api/pre-experiment/start", "POST", payload);
        currentSession = data.session_id;
        currentMode = data.mode || "pre_experiment";
        activeRootPersona = data?.interviewed?.persona || adminPersonaEl.value;
        activeTargetPersona = data?.interviewer?.persona || receiverPersonaEl.value;
        clearOutputLogs();
        setInterviewModeState(currentMode, true);
        setInterviewTimeDisplays(data.started_at || new Date().toISOString(), null);
        sessionMeta.textContent = `Active session: ${currentSession} (${data.mode})`;
        setStatus(READY_STATUS, "ok");
        setLiveOutputState(true);
        if (promptPreview) {
          promptPreview.value = data.debug_prompts?.interviewer_prompt || "";
        }
        if (receiverPromptPreview) {
          receiverPromptPreview.value = data.debug_prompts?.interviewed_prompt || "";
        }
        if (data.interviewer) {
          addTargetLog(data.interviewer.raw_response || "", "sys");
          addTargetAnalysis(data.interviewer.question || null);
        }
        if (data.current_question) {
          setStatus(`Round ready. Pending question: ${data.current_question}`, "ok");
        }
      } catch (err) {
        setStatus(`Start failed: ${err.message}`, "error");
      }
    });

    shockNext.addEventListener("click", async () => {
      if (!currentSession) {
        setStatus("Start a session first.", "warm");
        return;
      }

      try {
        const nextEndpoint = currentMode === "post_experiment"
          ? "/api/post-experiment/next"
          : "/api/pre-experiment/next";
        const data = await request(nextEndpoint, "POST", {
          session_id: currentSession,
          top_k: 5,
        });
        currentMode = data.mode || currentMode;
        if (promptPreview) {
          promptPreview.value = data.debug_prompts?.interviewer_prompt || "";
        }
        if (receiverPromptPreview) {
          receiverPromptPreview.value = data.debug_prompts?.interviewed_prompt || "";
        }

        if (data.interviewed) {
          addRootLog(data.interviewed.raw_response || "", "sys");
          addRootAnalysis(data.interviewed?.response || null);
        }

        if (data.interviewer) {
          addTargetLog(data.interviewer.raw_response || "", "sys");
          addTargetAnalysis(data.interviewer.question || null);
        }
        if (data.current_question) {
          setStatus(`Next question ready: ${data.current_question}`, "ok");
        }
      } catch (err) {
        setStatus(`Next question failed: ${err.message}`, "error");
      }
    });

    finishBtn.addEventListener("click", async () => {
      const payload = {
        interviewed_persona: adminPersonaEl.value,
        interviewer_persona: receiverPersonaEl.value,
        top_k: 5,
      };

      try {
        const data = await request("/api/post-experiment/start", "POST", payload);
        currentSession = data.session_id;
        currentMode = data.mode || "post_experiment";
        activeRootPersona = data?.interviewed?.persona || adminPersonaEl.value;
        activeTargetPersona = data?.interviewer?.persona || receiverPersonaEl.value;
        clearOutputLogs();
        setInterviewModeState(currentMode, true);
        setInterviewTimeDisplays(data.started_at || new Date().toISOString(), null);
        const sourceTag = data.source_experiment?.session_id
          ? ` | source: ${data.source_experiment.session_id} (${data.source_experiment.role || "unknown"})`
          : "";
        sessionMeta.textContent = `Active session: ${currentSession} (${data.mode})${sourceTag}`;
        setStatus(READY_STATUS, "ok");
        setLiveOutputState(true);
        if (promptPreview) {
          promptPreview.value = data.debug_prompts?.interviewer_prompt || "";
        }
        if (receiverPromptPreview) {
          receiverPromptPreview.value = data.debug_prompts?.interviewed_prompt || "";
        }
        if (data.interviewer) {
          addTargetLog(data.interviewer.raw_response || "", "sys");
          addTargetAnalysis(data.interviewer.question || null);
        }
        if (data.current_question) {
          setStatus(`Round ready. Pending question: ${data.current_question}`, "ok");
        }
      } catch (err) {
        setStatus(`Post start failed: ${err.message}`, "error");
      }
    });

    finishInterviewBtn.addEventListener("click", async () => {
      if (!currentSession) {
        setStatus("No active session.", "warm");
        return;
      }

      try {
        const data = await request("/api/session/finish", "POST", {
          session_id: currentSession,
          closing_note: "User ended session from UI.",
          top_k: 5,
        });

        setStatus(`Session finished (${data.mode}).`, "ok");
        setLiveOutputState(false);
        setInterviewModeState(data.mode || currentMode, false);
        setInterviewTimeDisplays(data.started_at || null, data.ended_at || new Date().toISOString());
        for (const [role, item] of Object.entries(data.reflections || {})) {
          const text = `${role} reflection:\n${item.raw_response}\n(memory: ${item.memory_id})`;
          if (role === "interviewed") {
            addRootLog(text, "sys");
            continue;
          }
          if (role === "interviewer") {
            addTargetLog(text, "sys");
            continue;
          }
          routePersonaLog(item.persona, text, "sys");
        }
        currentSession = null;
        currentMode = null;
        sessionMeta.textContent = "No active session.";
      } catch (err) {
        setStatus(`Finish failed: ${err.message}`, "error");
      }
    });

    clearOutputLogs();
    setLiveOutputState(false);
    setInterviewModeState(null, false);
    setInterviewTimeDisplays(null, null);
    sessionMeta.textContent = "No active session.";
    updateMontrealClock();
    setInterval(updateMontrealClock, 1000);
    setStatus("Loading backend...", "warm");
    loadHealth();
  </script>
</body>
</html>
